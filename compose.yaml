      SIGNAL_SPARK_OFFICIAL_MODEL: ${SIGNAL_SPARK_OFFICIAL_MODEL:-}
      SIGNAL_GROK_ROUTE: ${SIGNAL_GROK_ROUTE:-}
      SIGNAL_GROK_OFFICIAL_MODEL: ${SIGNAL_GROK_OFFICIAL_MODEL:-}
      SIGNAL_MISTRAL_ROUTE: ${SIGNAL_MISTRAL_ROUTE:-}
      SIGNAL_MISTRAL_OFFICIAL_MODEL: ${SIGNAL_MISTRAL_OFFICIAL_MODEL:-}
      SIGNAL_OPENROUTER_ROUTE: ${SIGNAL_OPENROUTER_ROUTE:-}
      SIGNAL_OPENROUTER_OFFICIAL_MODEL: ${SIGNAL_OPENROUTER_OFFICIAL_MODEL:-}
      SIGNAL_CUSTOM_ROUTE: ${SIGNAL_CUSTOM_ROUTE:-}
      SIGNAL_CUSTOM_OFFICIAL_MODEL: ${SIGNAL_CUSTOM_OFFICIAL_MODEL:-}
      SIGNAL_OPENAI_ROUTE: ${SIGNAL_OPENAI_ROUTE:-}
      SIGNAL_OPENAI_OFFICIAL_MODEL: ${SIGNAL_OPENAI_OFFICIAL_MODEL:-}
      SIGNAL_ANTHROPIC_ROUTE: ${SIGNAL_ANTHROPIC_ROUTE:-}
      SIGNAL_ANTHROPIC_OFFICIAL_MODEL: ${SIGNAL_ANTHROPIC_OFFICIAL_MODEL:-}
      SIGNAL_GEMINI_ROUTE: ${SIGNAL_GEMINI_ROUTE:-}
      SIGNAL_GEMINI_OFFICIAL_MODEL: ${SIGNAL_GEMINI_OFFICIAL_MODEL:-}
      SIGNAL_PERPLEXITY_ROUTE: ${SIGNAL_PERPLEXITY_ROUTE:-}
      SIGNAL_PERPLEXITY_OFFICIAL_MODEL: ${SIGNAL_PERPLEXITY_OFFICIAL_MODEL:-}
      SIGNAL_DEEPSEEK_ROUTE: ${SIGNAL_DEEPSEEK_ROUTE:-}
      SIGNAL_DEEPSEEK_OFFICIAL_MODEL: ${SIGNAL_DEEPSEEK_OFFICIAL_MODEL:-}
      SIGNAL_DEEPSEEK_NVIDIA_NIM_MODEL: ${SIGNAL_DEEPSEEK_NVIDIA_NIM_MODEL:-}
      SIGNAL_QWEN_ROUTE: ${SIGNAL_QWEN_ROUTE:-}
      SIGNAL_QWEN_OFFICIAL_MODEL: ${SIGNAL_QWEN_OFFICIAL_MODEL:-}
      SIGNAL_QWEN_SILICONFLOW_MODEL: ${SIGNAL_QWEN_SILICONFLOW_MODEL:-}
      SIGNAL_QWEN_NVIDIA_NIM_MODEL: ${SIGNAL_QWEN_NVIDIA_NIM_MODEL:-}
      SIGNAL_ZHIPU_ROUTE: ${SIGNAL_ZHIPU_ROUTE:-}
      SIGNAL_ZHIPU_OFFICIAL_MODEL: ${SIGNAL_ZHIPU_OFFICIAL_MODEL:-}
      SIGNAL_ZHIPU_SILICONFLOW_MODEL: ${SIGNAL_ZHIPU_SILICONFLOW_MODEL:-}
      SIGNAL_KIMI_ROUTE: ${SIGNAL_KIMI_ROUTE:-}
      SIGNAL_KIMI_OFFICIAL_MODEL: ${SIGNAL_KIMI_OFFICIAL_MODEL:-}
      SIGNAL_KIMI_NVIDIA_NIM_MODEL: ${SIGNAL_KIMI_NVIDIA_NIM_MODEL:-}
      SIGNAL_DOUBAO_ROUTE: ${SIGNAL_DOUBAO_ROUTE:-}
      SIGNAL_DOUBAO_OFFICIAL_MODEL: ${SIGNAL_DOUBAO_OFFICIAL_MODEL:-}
      SIGNAL_MINIMAX_ROUTE: ${SIGNAL_MINIMAX_ROUTE:-}
      SIGNAL_MINIMAX_OFFICIAL_MODEL: ${SIGNAL_MINIMAX_OFFICIAL_MODEL:-}
      SIGNAL_MINIMAX_OPENROUTER_MODEL: ${SIGNAL_MINIMAX_OPENROUTER_MODEL:-}
      SIGNAL_MINIMAX_NVIDIA_NIM_MODEL: ${SIGNAL_MINIMAX_NVIDIA_NIM_MODEL:-}
      SIGNAL_HUNYUAN_ROUTE: ${SIGNAL_HUNYUAN_ROUTE:-}
      SIGNAL_HUNYUAN_OFFICIAL_MODEL: ${SIGNAL_HUNYUAN_OFFICIAL_MODEL:-}
      SIGNAL_BAI_ROUTE: ${SIGNAL_BAI_ROUTE:-}
      SIGNAL_BAI_OFFICIAL_MODEL: ${SIGNAL_BAI_OFFICIAL_MODEL:-}
    expose:
      - "8080"
    volumes:
      - signal-geo-runtime:/app/runtime
    stop_grace_period: 30s
  https:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      SIGNAL_PUBLIC_HOST: ${SIGNAL_PUBLIC_HOST:?Set SIGNAL_PUBLIC_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - signal-geo-tls:/data
      - signal-geo-caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
volumes:
  signal-geo-runtime:
  signal-geo-tls:
  signal-geo-caddy-config:
