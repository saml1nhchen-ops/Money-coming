services:
  backend:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      PORT: "8080"
    ports:
      # Keep the raw HTTP gateway private behind a trusted HTTPS reverse proxy.
      - "127.0.0.1:8080:8080"
    volumes:
      - signal-geo-runtime:/app/runtime
    stop_grace_period: 30s
volumes:
  signal-geo-runtime:
