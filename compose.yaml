# Tencent Cloud / Alibaba Cloud: one backend, one TLS edge, persistent volumes.
services:
  backend:
    build: .
    image: signal-geo-backend:team
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      PORT: "8080"
      SIGNAL_ERNIE_API_KEY: ${SIGNAL_ERNIE_API_KEY:-}
      SIGNAL_ERNIE_MODEL: ${SIGNAL_ERNIE_MODEL:-}
      SIGNAL_ERNIE_BASE_URL: ${SIGNAL_ERNIE_BASE_URL:-}
      SIGNAL_SPARK_API_KEY: ${SIGNAL_SPARK_API_KEY:-}
      SIGNAL_SPARK_MODEL: ${SIGNAL_SPARK_MODEL:-}
      SIGNAL_SPARK_BASE_URL: ${SIGNAL_SPARK_BASE_URL:-}
      SIGNAL_GROK_API_KEY: ${SIGNAL_GROK_API_KEY:-}
      SIGNAL_GROK_MODEL: ${SIGNAL_GROK_MODEL:-}
      SIGNAL_GROK_BASE_URL: ${SIGNAL_GROK_BASE_URL:-}
      SIGNAL_MISTRAL_API_KEY: ${SIGNAL_MISTRAL_API_KEY:-}
      SIGNAL_MISTRAL_MODEL: ${SIGNAL_MISTRAL_MODEL:-}
      SIGNAL_MISTRAL_BASE_URL: ${SIGNAL_MISTRAL_BASE_URL:-}
      SIGNAL_OPENROUTER_API_KEY: ${SIGNAL_OPENROUTER_API_KEY:-}
      SIGNAL_OPENROUTER_MODEL: ${SIGNAL_OPENROUTER_MODEL:-}
      SIGNAL_OPENROUTER_BASE_URL: ${SIGNAL_OPENROUTER_BASE_URL:-}
      SIGNAL_CUSTOM_API_KEY: ${SIGNAL_CUSTOM_API_KEY:-}
      SIGNAL_CUSTOM_MODEL: ${SIGNAL_CUSTOM_MODEL:-}
      SIGNAL_CUSTOM_BASE_URL: ${SIGNAL_CUSTOM_BASE_URL:-}
      SIGNAL_OPENAI_API_KEY: ${SIGNAL_OPENAI_API_KEY:-}
      SIGNAL_OPENAI_MODEL: ${SIGNAL_OPENAI_MODEL:-}
      SIGNAL_OPENAI_BASE_URL: ${SIGNAL_OPENAI_BASE_URL:-}
      SIGNAL_ANTHROPIC_API_KEY: ${SIGNAL_ANTHROPIC_API_KEY:-}
      SIGNAL_ANTHROPIC_MODEL: ${SIGNAL_ANTHROPIC_MODEL:-}
      SIGNAL_ANTHROPIC_BASE_URL: ${SIGNAL_ANTHROPIC_BASE_URL:-}
      SIGNAL_GEMINI_API_KEY: ${SIGNAL_GEMINI_API_KEY:-}
      SIGNAL_GEMINI_MODEL: ${SIGNAL_GEMINI_MODEL:-}
      SIGNAL_GEMINI_BASE_URL: ${SIGNAL_GEMINI_BASE_URL:-}
      SIGNAL_PERPLEXITY_API_KEY: ${SIGNAL_PERPLEXITY_API_KEY:-}
      SIGNAL_PERPLEXITY_MODEL: ${SIGNAL_PERPLEXITY_MODEL:-}
      SIGNAL_PERPLEXITY_BASE_URL: ${SIGNAL_PERPLEXITY_BASE_URL:-}
      SIGNAL_DEEPSEEK_API_KEY: ${SIGNAL_DEEPSEEK_API_KEY:-}
      SIGNAL_DEEPSEEK_MODEL: ${SIGNAL_DEEPSEEK_MODEL:-}
      SIGNAL_DEEPSEEK_BASE_URL: ${SIGNAL_DEEPSEEK_BASE_URL:-}
      SIGNAL_QWEN_API_KEY: ${SIGNAL_QWEN_API_KEY:-}
      SIGNAL_QWEN_MODEL: ${SIGNAL_QWEN_MODEL:-}
      SIGNAL_QWEN_BASE_URL: ${SIGNAL_QWEN_BASE_URL:-}
      SIGNAL_ZHIPU_API_KEY: ${SIGNAL_ZHIPU_API_KEY:-}
      SIGNAL_ZHIPU_MODEL: ${SIGNAL_ZHIPU_MODEL:-}
      SIGNAL_ZHIPU_BASE_URL: ${SIGNAL_ZHIPU_BASE_URL:-}
      SIGNAL_KIMI_API_KEY: ${SIGNAL_KIMI_API_KEY:-}
      SIGNAL_KIMI_MODEL: ${SIGNAL_KIMI_MODEL:-}
      SIGNAL_KIMI_BASE_URL: ${SIGNAL_KIMI_BASE_URL:-}
