name: Check public website diagnostics
on:
  push:
    branches: ['diagnose/brand-source-*']
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.deleted == false && github.event.forced == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Read Cremo official page without a model call
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import sys
          sys.path[:0]=['tools','deploy']
          from geo_flow import fetch_website
          from brand_enrichment import website_candidates
          from connection_diagnostics import publish
          report={'kind':'public_website_candidates','url':'https://cremocompany.com/','chat_calls':0}
          try:
              page=fetch_website(report['url'],allow_short=True)
              brand,products=website_candidates(page,'US')
              report.update(status='fetched',brand=brand,products=products,captured_at=page['captured_at'],content_sha256=page['content_sha256'],diagnostics=page.get('diagnostics'))
          except Exception as error:
              report.update(status='failed',error_type=type(error).__name__,diagnostics=getattr(error,'diagnostics',None))
          print('Saved public source evidence to '+publish(report))
          if not isinstance(report.get('diagnostics'),dict):sys.exit(1)
          # A reported access restriction verifies diagnostics, not successful extraction.
          PYCODE
