name: Frontend preview package
on:
  pull_request:
    paths:
      - 'dist/**'
      - 'tests/test_frontend.cjs'
      - 'tests/test_diagnostic.cjs'
      - 'deploy/build-preview.cjs'
      - 'netlify.toml'
      - '.github/workflows/frontend-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check frontend and build preview
        run: |
          node tests/test_frontend.cjs
          node tests/test_diagnostic.cjs
          node deploy/build-preview.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-preview-${{ github.run_id }}
          path: preview-dist/
          retention-days: 7
          if-no-files-found: error
