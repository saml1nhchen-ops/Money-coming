name: Request formal backend release
on:
  push:
    tags: ['release-request/v*']
permissions:
  contents: read
concurrency:
  group: signal-geo-release-request-${{ github.ref }}
  cancel-in-progress: false
jobs:
  request:
    if: github.event.deleted == false && github.event.forced == false && startsWith(github.ref, 'refs/tags/release-request/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.request.outputs.tag }}
      revision: ${{ steps.request.outputs.revision }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate trusted request commit and create or reuse the formal Release
        id: request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 deploy/release_request.py request
  deploy:
    needs: request
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-backend.yml
    with:
      release_tag: ${{ needs.request.outputs.release_tag }}
      expected_revision: ${{ needs.request.outputs.revision }}
    secrets: inherit
